# Uso por perfil:
#   docker compose --env-file profiles/A.env up -d mongodb
#   docker compose --env-file profiles/B.env up -d postgresql
#   docker compose --env-file profiles/C.env up -d mongodb
#
# Decisiones de diseño:
# 1. Sin HEALTHCHECK interno en los motores: ejecutar mongosh o pg_isready dentro del
#    contenedor consume cuota CFS y páginas de memoria del mismo cgroup medido.
# 2. En cgroups v2, mem_swappiness es ignorado por el kernel; la desactivación real de swap
#    se impone igualando memswap_limit a mem_limit (0 bytes de swap permitidos).
# 3. Se fijan explícitamente las cachés con la regla por defecto documentada por cada fabricante,
#    aplicada al límite del contenedor: wiredTigerCacheSizeGB = max(0.25, 0.5 x (RAM - 1 GB))
#    (MongoDB) y shared_buffers = 25% RAM (PostgreSQL).
# 4. cAdvisor se configura con housekeeping_interval=1s y allow_dynamic_housekeeping=false
#    para que el scrape de 1s de Prometheus no repita muestras obsoletas.

name: bench

x-engine: &engine
  cpus: ${BENCH_CPUS:-4.0}
  cpuset: "${BENCH_CPUSET_DB:-0-3}"
  mem_limit: ${BENCH_MEM:-4096m}
  memswap_limit: ${BENCH_MEM:-4096m}
  mem_swappiness: 0
  restart: "no"

x-telemetry: &telemetry
  cpuset: "${BENCH_CPUSET_TELEMETRY:-4,5,10,11}"
  restart: unless-stopped

services:
  mongodb:
    <<: *engine
    image: mongo:9.0.4@sha256:452bdaf2127b8ff851e31410a267809b9829eded219979f2210e7c7efb85a058
    container_name: bench-mongodb
    environment:
      TZ: UTC
    command:
      - mongod
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "${MONGO_WT_CACHE_GB:-1.5}"
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo_data:/data/db"]

  postgresql:
    <<: *engine
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    container_name: bench-postgresql
    shm_size: 1g
    ports: ["127.0.0.1:5433:5432"]
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1024MB}
      - -c
      - log_temp_files=0
      - -c
      - max_connections=120
    volumes: ["pg_data:/var/lib/postgresql"]

  cadvisor:
    <<: *telemetry
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: bench-cadvisor
    privileged: true
    command:
      - --housekeeping_interval=500ms
      - --max_housekeeping_interval=1s
      - --allow_dynamic_housekeeping=false
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  node-exporter:
    <<: *telemetry
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: bench-node-exporter
    pid: host
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro"]

  prometheus:
    <<: *telemetry
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: bench-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=60d
    ports: ["127.0.0.1:9091:9090"]
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  mongo_data:
  pg_data:
  prometheus_data:
